name: Build AURA Phone and publish release
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q AuraPhoneLauncher.zip -d /tmp/p

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: /tmp/p/AuraPhoneLauncher
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AuraPhone-debug-apk
          path: /tmp/p/AuraPhoneLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/p/AuraPhoneLauncher/app/build/outputs/apk/debug/app-debug.apk AuraPhone-Launcher.apk
          gh release create "v1.0.${{ github.run_number }}" AuraPhone-Launcher.apk \
            --repo ${{ github.repository }} \
            --title "AURA Phone v1.0.${{ github.run_number }}" \
            --notes "Phone build of the AURA launcher (horizontal TV-style rows)."
